name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas librosa soundfile scikit-learn pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run the test suite
        run: pytest -q tests/

      - name: Check the CLIs are importable
        run: |
          cd src
          python -m anxiety_speech.train --help
          python -m anxiety_speech.evaluate --help
          python -m anxiety_speech.predict --help
